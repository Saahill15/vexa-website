name: Owner release website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VEXA_SSH_HOST: ${{ secrets.VEXA_SSH_HOST }}
      VEXA_SSH_USER: ${{ secrets.VEXA_SSH_USER }}
      VEXA_SSH_KEY: ${{ secrets.VEXA_SSH_KEY }}
      VEXA_SSH_KNOWN_HOSTS: ${{ vars.VEXA_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing owner configuration
        run: |
          test -n "$VEXA_SSH_HOST" && test -n "$VEXA_SSH_USER" && test -n "$VEXA_SSH_KEY" && test -n "$VEXA_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VEXA_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VEXA_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Backup existing source and database
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VEXA_SSH_USER@$VEXA_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/vexa/site
          release_stamp=$(date -u +%Y%m%dT%H%M%SZ)
          release_backup=/opt/vexa/site-backups/github-$release_stamp
          mkdir -p "$release_backup"
          tar --exclude=.env --exclude=data --exclude=node_modules --exclude='.next*' -czf "$release_backup/source.tgz" .
          docker exec vexa-site node -e 'const fs=require("fs");fs.mkdirSync("/app/data/backups",{recursive:true});const DB=require("better-sqlite3");const db=new DB("/app/data/vexa.db",{readonly:true});db.backup("/app/data/backups/github-"+Date.now()+".db").then(()=>db.close()).catch(e=>{console.error(e.message);process.exit(1)})'
          docker tag "$(docker inspect -f '{{.Image}}' vexa-site)" "vexa-site:pre-github-$release_stamp"
          test "$(df -Pk /opt/vexa/site | awk 'NR==2 {print $4}')" -gt 2097152
          REMOTE
      - name: Sync source without deleting server files
        run: |
          rsync -az --exclude '.git' --exclude 'node_modules' --exclude '.next*' --exclude '.env*' --exclude '.local' --exclude 'data' --exclude '*.db*' --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" ./ "$VEXA_SSH_USER@$VEXA_SSH_HOST:/opt/vexa/site/"
      - name: Build and release the website service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VEXA_SSH_USER@$VEXA_SSH_HOST" \
            'cd /opt/vexa/site && docker compose -p site -f docker-compose.site.yml build site && docker compose -p site -f docker-compose.site.yml up -d --no-deps site'
      - name: Check public readiness
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 5 https://www.vexadigital.in/ -o /dev/null
      - name: Remove temporary credential
        if: always()
        run: rm -f ~/.ssh/deploy_key
