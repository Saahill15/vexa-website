# Production Compose project "site", run from /opt/vexa/site.
# Independent from OS, Valuate and n8n. See docs/DEPLOYMENT.md.
services:
  site:
    build: .
    container_name: vexa-site
    restart: unless-stopped
    environment:
      # Optional: a webhook (for example n8n) told about each brief. Empty means disk only.
      - CONTACT_WEBHOOK_URL=${CONTACT_WEBHOOK_URL:-}
      - CONTACT_WEBHOOK_TOKEN=${CONTACT_WEBHOOK_TOKEN:-}
      # Sign in and leads. The real values live in /opt/vexa/site/.env on the server, never in this repo.
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://www.vexadigital.in}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_IDENTITY_ENABLED=${GOOGLE_IDENTITY_ENABLED:-false}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ACCOUNT_MAIL_WEBHOOK_URL=${ACCOUNT_MAIL_WEBHOOK_URL:-}
      - ACCOUNT_MAIL_WEBHOOK_TOKEN=${ACCOUNT_MAIL_WEBHOOK_TOKEN:-}
      - VEXA_DATA_DIR=/app/data
      - VEXA_TRUST_PROXY=${VEXA_TRUST_PROXY:-0}
    volumes:
      - site_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vexa_edge"
      - "traefik.http.routers.site.rule=Host(`vexadigital.in`) || Host(`www.vexadigital.in`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls=true"
      - "traefik.http.routers.site.tls.certresolver=le"
      - "traefik.http.services.site.loadbalancer.server.port=3000"
    networks:
      - edge
networks:
  edge:
    external: true
    name: vexa_edge
volumes:
  site_data:
