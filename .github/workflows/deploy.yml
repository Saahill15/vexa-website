name: Deploy site

on:
  push:
    branches: [live-site]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  # Where the source is synced. The site service builds from this folder.
  SERVER_PATH: /opt/vexa/site
  # Where the live compose file lives. Per PASTE_DEPLOY.md the site service was added to the
  # existing Traefik, n8n and brain stack in /opt/vexa/n8n/docker-compose.yml.
  COMPOSE_DIR: /opt/vexa/site

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy secrets
        env:
          VEXA_SSH_KEY: ${{ secrets.VEXA_SSH_KEY }}
          VEXA_SSH_HOST: ${{ secrets.VEXA_SSH_HOST }}
          VEXA_SSH_USER: ${{ secrets.VEXA_SSH_USER }}
        run: |
          missing=""
          [ -z "$VEXA_SSH_KEY" ] && missing="$missing VEXA_SSH_KEY"
          [ -z "$VEXA_SSH_HOST" ] && missing="$missing VEXA_SSH_HOST"
          [ -z "$VEXA_SSH_USER" ] && missing="$missing VEXA_SSH_USER"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Missing repository secrets:$missing. Add them (see DEPLOY.md) and rerun. Nothing was deployed."
            exit 1
          fi
          echo "All deploy secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key and pinned known hosts
        env:
          VEXA_SSH_KEY: ${{ secrets.VEXA_SSH_KEY }}
          VEXA_SSH_HOST: ${{ secrets.VEXA_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VEXA_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$VEXA_SSH_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync files to the server
        env:
          VEXA_SSH_HOST: ${{ secrets.VEXA_SSH_HOST }}
          VEXA_SSH_USER: ${{ secrets.VEXA_SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.env*' --exclude '/data' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            ./ "$VEXA_SSH_USER@$VEXA_SSH_HOST:$SERVER_PATH/"

      - name: Rebuild and restart the site container
        env:
          VEXA_SSH_HOST: ${{ secrets.VEXA_SSH_HOST }}
          VEXA_SSH_USER: ${{ secrets.VEXA_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VEXA_SSH_USER@$VEXA_SSH_HOST" \
            "cd $COMPOSE_DIR && docker compose -f docker-compose.site.yml up -d --build"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
